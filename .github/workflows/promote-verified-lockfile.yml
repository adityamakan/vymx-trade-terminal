name: Promote verified dependency lockfile

on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]
    branches: [main]

permissions:
  actions: read
  contents: write

jobs:
  promote:
    if: github.event.workflow_run.id == 43879440978 && github.event.workflow_run.event == 'push' && github.event.workflow_run.head_branch == 'main'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out current main
        uses: actions/checkout@v7
        with:
          ref: main
          fetch-depth: 0

      - name: Download the tested candidate artifact
        uses: actions/download-artifact@v7
        with:
          name: dependency-lockfile-candidate
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ github.token }}
          path: candidate

      - name: Validate candidate and ensure source is still in main history
        env:
          SOURCE_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          set -euo pipefail
          test -s candidate/package-lock.json
          test -s candidate/candidate-audit.json
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const report = JSON.parse(fs.readFileSync('candidate/candidate-audit.json', 'utf8'));
          const counts = report.metadata?.vulnerabilities;
          if (!counts || counts.total !== 0) {
            throw new Error('Refusing to promote a candidate without a verified zero-vulnerability audit.');
          }
          console.log('Candidate audit is clean:', JSON.stringify(counts));
          NODE
          git merge-base --is-ancestor "$SOURCE_SHA" origin/main

      - name: Promote the verified lockfile
        run: |
          set -euo pipefail
          cp candidate/package-lock.json package-lock.json
          if git diff --quiet -- package-lock.json; then
            echo "The verified candidate is already present on main."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json
          git commit -m "chore: promote audited dependency lockfile"
          git push origin HEAD:main
