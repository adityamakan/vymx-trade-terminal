name: Production availability monitor

on:
  schedule:
    - cron: '17,47 * * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: production-availability-monitor
  cancel-in-progress: true

jobs:
  smoke:
    name: Production API, provider and WebSocket smoke tests
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Check out main
        uses: actions/checkout@v7
        with:
          ref: main
      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '22.19.0'
          cache: npm
      - name: Install production runtime dependencies
        run: npm ci --omit=dev
      - name: Verify production health, market data and WebSocket heartbeat
        env:
          PRODUCTION_BASE_URL: https://vymx-trade-terminal-2.onrender.com
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          import WebSocket from 'ws';
          const baseUrl = process.env.PRODUCTION_BASE_URL;
          if (!baseUrl || !baseUrl.startsWith('https://')) throw new Error('PRODUCTION_BASE_URL must be an HTTPS origin.');

          async function fetchWithRetry(url, options = {}, attempts = 3) {
            let lastError;
            for (let attempt = 1; attempt <= attempts; attempt += 1) {
              try {
                const response = await fetch(url, { ...options, signal: AbortSignal.timeout(12_000) });
                if (response.status >= 500 && attempt < attempts) {
                  await new Promise(resolve => setTimeout(resolve, attempt * 5_000));
                  continue;
                }
                return response;
              } catch (error) {
                lastError = error;
                if (attempt < attempts) await new Promise(resolve => setTimeout(resolve, attempt * 5_000));
              }
            }
            throw lastError ?? new Error(`Request failed after ${attempts} attempts: ${url}`);
          }

          const healthResponse = await fetchWithRetry(new URL('/health', baseUrl));
          if (!healthResponse.ok) throw new Error(`Production health returned HTTP ${healthResponse.status}`);
          const health = await healthResponse.json();
          if (health.status !== 'ok' || health.service !== 'vymx-api') throw new Error('Unexpected production health payload.');
          console.log(`Health OK; uptime=${health.uptimeSeconds}s`);

          const appShellResponse = await fetchWithRetry(new URL('/', baseUrl));
          if (!appShellResponse.ok) throw new Error(`Production frontend returned HTTP ${appShellResponse.status}`);
          const appHtml = await appShellResponse.text();
          if (!appShellResponse.headers.get('content-type')?.includes('text/html') || !appHtml.includes('id="root"')) {
            throw new Error('Production frontend did not return the expected VYMX application shell.');
          }
          const appScript = appHtml.match(/<script\b[^>]*\bsrc="([^"]+\.js(?:\?[^"]*)?)"/i)?.[1];
          if (!appScript) throw new Error('Production frontend did not reference a built JavaScript bundle.');
          const bundleResponse = await fetchWithRetry(new URL(appScript, baseUrl), { method: 'HEAD' });
          if (!bundleResponse.ok) throw new Error(`Production frontend bundle returned HTTP ${bundleResponse.status}`);
          console.log('Frontend HTML shell and built JavaScript asset OK.');

          const monitoredSymbols = ['AAPL', 'RELIANCE.NS', 'BTC-USD', 'INR=X'];
          const pricesResponse = await fetchWithRetry(new URL('/api/prices', baseUrl), {
            method: 'POST',
            headers: { 'content-type': 'application/json' },
            body: JSON.stringify({ symbols: monitoredSymbols })
          });
          if (!pricesResponse.ok) throw new Error(`Market-data endpoint returned HTTP ${pricesResponse.status}`);
          const prices = await pricesResponse.json();
          if (prices.success !== true || !prices.prices || typeof prices.prices !== 'object') {
            throw new Error('Market-data endpoint did not return a provider quote payload.');
          }
          const validQuotes = {};
          for (const symbol of monitoredSymbols) {
            const quote = prices.prices[symbol];
            if (!quote || typeof quote.price !== 'number' || !Number.isFinite(quote.price) || quote.price <= 0) continue;
            if (quote.source !== 'Yahoo Finance' || typeof quote.asOf !== 'string' || !Number.isFinite(Date.parse(quote.asOf))) continue;
            const observedAt = Date.parse(quote.asOf);
            const quoteAgeMs = Date.now() - observedAt;
            if (observedAt > Date.now() + 5 * 60_000 || quoteAgeMs > 7 * 24 * 60 * 60_000) continue;
            validQuotes[symbol] = { asOf: quote.asOf, ageHours: Math.round(quoteAgeMs / 3_600_000) };
          }
          if (!validQuotes.AAPL || !validQuotes['BTC-USD']) {
            throw new Error('Provider smoke test requires fresh-enough US equity and crypto observations.');
          }
          if (Object.keys(validQuotes).length < 3) {
            throw new Error(`Cross-asset quote coverage below 3/4: ${Object.keys(validQuotes).length}/4`);
          }
          const quoteCoverage = { fresh: Object.keys(validQuotes).length, requested: monitoredSymbols.length, symbols: validQuotes };
          console.log(`Cross-asset market data OK; coverage=${quoteCoverage.fresh}/${quoteCoverage.requested}; ${JSON.stringify(validQuotes)}`);

          const providerStatusResponse = await fetchWithRetry(new URL('/api/providers/status', baseUrl));
          if (!providerStatusResponse.ok) throw new Error(`Provider status endpoint returned HTTP ${providerStatusResponse.status}`);
          const providerStatusPayload = await providerStatusResponse.json();
          const marketProvider = providerStatusPayload?.providers?.marketData;
          if (!marketProvider || !Number.isFinite(marketProvider.requests) || !Number.isFinite(marketProvider.successes)) {
            throw new Error('Provider status payload is missing request telemetry.');
          }
          if (marketProvider.successes < 1 || !marketProvider.lastSuccessAt || !Number.isFinite(Date.parse(marketProvider.lastSuccessAt))) {
            throw new Error('No successful upstream market-data request is recorded in this process.');
          }
          console.log(`Provider telemetry OK; status=${marketProvider.status}; requests=${marketProvider.requests}; successes=${marketProvider.successes}; failures=${marketProvider.failures}; timeouts=${marketProvider.timeouts}; avgLatencyMs=${marketProvider.averageLatencyMs ?? 'n/a'}`);

          const wsUrl = new URL('/api/prices', baseUrl);
          wsUrl.protocol = 'wss:';
          await new Promise((resolve, reject) => {
            const socket = new WebSocket(wsUrl, { headers: { Origin: baseUrl } });
            let settled = false;
            const finish = (error) => {
              if (settled) return;
              settled = true;
              clearTimeout(timeout);
              if (socket.readyState === WebSocket.OPEN || socket.readyState === WebSocket.CONNECTING) socket.close();
              if (error) reject(error); else resolve();
            };
            const timeout = setTimeout(() => {
              socket.terminate();
              finish(new Error('Production WebSocket heartbeat timed out.'));
            }, 8_000);
            socket.addEventListener('open', () => socket.send('ping'), { once: true });
            socket.addEventListener('message', event => { if (event.data === 'pong') finish(); });
            socket.addEventListener('error', () => finish(new Error('Production WebSocket connection failed.')));
            socket.addEventListener('close', event => finish(new Error(`WebSocket closed before heartbeat completed: ${event.code}`)));
          });
          console.log('WebSocket same-origin connection and heartbeat OK.');
          const productionHealth = {
            checkedAt: new Date().toISOString(),
            service: 'vymx-trade-terminal-2',
            provider: {
              name: marketProvider.name,
              status: marketProvider.status,
              requests: marketProvider.requests,
              successes: marketProvider.successes,
              failures: marketProvider.failures,
              timeouts: marketProvider.timeouts,
              averageLatencyMs: marketProvider.averageLatencyMs,
              lastSuccessAt: marketProvider.lastSuccessAt
            },
            quoteCoverage,
            websocket: 'ok'
          };
          fs.writeFileSync('production-health.json', JSON.stringify(productionHealth, null, 2));
          const summary = [
            '## VYMX production data health',
            '',
            `- Checked: ${productionHealth.checkedAt}`,
            `- Provider: ${marketProvider.name} (${marketProvider.status})`,
            `- Quote coverage: ${quoteCoverage.fresh}/${quoteCoverage.requested}`,
            `- Provider requests/successes/failures/timeouts: ${marketProvider.requests}/${marketProvider.successes}/${marketProvider.failures}/${marketProvider.timeouts}`,
            `- Average quote latency: ${marketProvider.averageLatencyMs ?? 'n/a'} ms`,
            '- WebSocket heartbeat: OK',
            '',
            '| Symbol | Provider observation | Approx. age (hours) |',
            '|---|---|---:|',
            ...Object.entries(quoteCoverage.symbols).map(([symbol, quote]) => `| ${symbol} | ${quote.asOf} | ${quote.ageHours} |`)
          ];
          fs.appendFileSync(process.env.GITHUB_STEP_SUMMARY, summary.join('\n') + '\n');
          NODE

      - name: Retain structured production health sample
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: production-health-${{ github.run_id }}
          path: production-health.json
          if-no-files-found: ignore
          retention-days: 14
