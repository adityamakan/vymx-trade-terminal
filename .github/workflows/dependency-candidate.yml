name: Dependency update candidate

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: dependency-candidate-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  candidate:
    name: Generate and validate non-breaking lockfile updates
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22.19.0'
          cache: npm

      # No --force: do not cross package major-version boundaries automatically.
      - name: Apply compatible audit fixes to a candidate lockfile
        run: npm audit fix --package-lock-only --ignore-scripts || true

      - name: Install candidate lockfile
        run: npm ci

      - name: Typecheck candidate dependencies
        run: npm run lint

      - name: Test candidate dependencies
        run: npm test

      - name: Build candidate dependencies
        run: npm run build

      - name: Upload reviewed lockfile candidate
        uses: actions/upload-artifact@v4
        with:
          name: dependency-lockfile-candidate
          path: package-lock.json
          retention-days: 7
