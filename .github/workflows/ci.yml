name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Typecheck, tests, build and dependency audit
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22.19.0'
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Typecheck
        run: npm run lint

      - name: Run tests
        run: npm test

      - name: Build production artifacts
        run: npm run build

      # Report-only initially: the repository's known advisories must be
      # triaged package-by-package before turning this into a blocking gate.
      - name: Generate dependency vulnerability report
        if: always()
        run: npm audit --json > npm-audit.json || true

      - name: Summarize dependency audit
        if: always()
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          let report = {};
          try {
            report = JSON.parse(fs.readFileSync('npm-audit.json', 'utf8'));
          } catch {
            report = { error: 'npm audit did not return valid JSON (network, registry, or npm failure).' };
          }
          const counts = report.metadata?.vulnerabilities ?? {};
          const lines = [
            '## Dependency audit (report-only)',
            '',
            '| Severity | Count |',
            '|---|---:|',
            ...['critical', 'high', 'moderate', 'low', 'info'].map(level => `| ${level} | ${counts[level] ?? 0} |`),
            '',
            report.error ?? 'This report does not automatically upgrade dependencies. Review each advisory, affected path, fix availability and compatibility before changing the lockfile.'
          ];
          fs.appendFileSync(process.env.GITHUB_STEP_SUMMARY, lines.join('\n') + '\n');
          NODE

      - name: Upload dependency audit report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: npm-audit-report
          path: npm-audit.json
          if-no-files-found: warn
          retention-days: 14
