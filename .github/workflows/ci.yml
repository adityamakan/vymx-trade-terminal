name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.head.sha || github.sha }}
  cancel-in-progress: true

jobs:
  quality:
    name: Typecheck, tests, build and dependency audit
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '22.19.0'
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Typecheck
        run: npm run lint

      - name: Run tests
        run: npm test

      - name: Build production artifacts
        run: npm run build:artifacts

      # Exercise the exact Node entry point Render starts, not only the bundler.
      - name: Prune build-only dependencies before runtime smoke test
        run: npm prune --omit=dev

      - name: Smoke test production server
        run: |
          PORT=4179 API_RATE_LIMIT_PER_MINUTE=2 WEBSOCKET_ALLOWED_ORIGINS=https://preview.example.net,https://deploy-preview-*--vymxtrade.netlify.app node dist-server/server.cjs > server-smoke.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true' EXIT

          for attempt in $(seq 1 30); do
            if curl --silent --show-error --fail http://127.0.0.1:4179/health > health.json; then
              node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const health = JSON.parse(fs.readFileSync('health.json', 'utf8'));
          if (health.status !== 'ok' || health.service !== 'vymx-api') {
            throw new Error('Unexpected production health response');
          }
          NODE
              break
            fi
            if [ "$attempt" -eq 30 ]; then
              cat server-smoke.log
              exit 1
            fi
            sleep 1
          done

          curl --silent --show-error --head http://127.0.0.1:4179/health | grep --ignore-case --quiet '^x-content-type-options: nosniff'

          curl --silent --show-error --fail http://127.0.0.1:4179/api/providers/status > provider-status.json
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const payload = JSON.parse(fs.readFileSync('provider-status.json', 'utf8'));
          const marketData = payload?.providers?.marketData;
          if (payload.success !== true || marketData?.name !== 'Yahoo Finance') {
            throw new Error('Unexpected provider status response');
          }
          if (marketData.status !== 'not_verified' || marketData.requests !== 0) {
            throw new Error('Provider telemetry must start unverified before an upstream request');
          }
          NODE

          invalid_status=$(curl --silent --output /tmp/vymx-invalid.json --write-out '%{http_code}' \
            -H 'Content-Type: application/json' \
            --data '{"symbols":"AAPL"}' http://127.0.0.1:4179/api/prices)
          test "$invalid_status" = "400"

          limited_status=$(curl --silent --output /tmp/vymx-limited.json --write-out '%{http_code}' \
            -H 'Content-Type: application/json' \
            --data '{"symbols":"AAPL"}' http://127.0.0.1:4179/api/prices)
          test "$limited_status" = "429"

          node --input-type=module <<'NODE'
          import WebSocket from 'ws';
          const url = 'ws://127.0.0.1:4179/api/prices';

          async function expectOpen(origin, heartbeat = false) {
            const ws = new WebSocket(url, { headers: { Origin: origin } });
            await new Promise((resolve, reject) => {
              const timeout = setTimeout(() => reject(new Error(`WebSocket open timed out for ${origin}`)), 5000);
              ws.once('open', () => {
                if (heartbeat) ws.send('ping');
                else { clearTimeout(timeout); ws.close(); resolve(); }
              });
              ws.on('message', (data) => {
                if (data.toString() === 'pong') {
                  clearTimeout(timeout);
                  ws.close();
                  resolve();
                }
              });
              ws.once('error', (error) => {
                clearTimeout(timeout);
                reject(error);
              });
            });
          }

          async function expectForbidden(origin) {
            const ws = new WebSocket(url, { headers: { Origin: origin } });
            const status = await new Promise((resolve, reject) => {
              const timeout = setTimeout(() => reject(new Error(`WebSocket rejection timed out for ${origin}`)), 5000);
              ws.once('unexpected-response', (_request, response) => {
                clearTimeout(timeout);
                resolve(response.statusCode);
              });
              ws.once('open', () => {
                clearTimeout(timeout);
                ws.close();
                reject(new Error(`Unexpectedly accepted disallowed origin: ${origin}`));
              });
              ws.once('error', (error) => {
                clearTimeout(timeout);
                if (error.message.includes('Unexpected server response: 403')) resolve(403);
                else reject(error);
              });
            });
            if (status !== 403) throw new Error(`Expected 403 for ${origin}, received ${status}`);
          }

          await expectOpen('http://127.0.0.1:4179', true);
          await expectOpen('https://preview.example.net');
          await expectOpen('https://deploy-preview-123--vymxtrade.netlify.app');
          await expectForbidden('https://attacker.example.org');
          NODE

      - name: Set up Java for Firestore Emulator
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'

      - name: Install Firestore rules test dependencies
        run: |
          # The ephemeral Firebase emulator toolchain currently resolves a transitive
          # @babel/traverse@^7.29.14 range that is not published. Pin only this
          # temporary toolchain to the latest published 7.x patch; do not alter the
          # application's committed dependency lockfile.
          cp package.json /tmp/vymx-package.json
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const pkg = JSON.parse(fs.readFileSync('package.json', 'utf8'));
          pkg.overrides = { ...(pkg.overrides ?? {}), '@babel/traverse': '7.29.13' };
          fs.writeFileSync('package.json', JSON.stringify(pkg, null, 2) + '\n');
          NODE
          npm install --no-save --package-lock=false --no-audit --no-fund --ignore-scripts @firebase/rules-unit-testing@5.0.2 firebase-tools@14.15.1
          cp /tmp/vymx-package.json package.json

      - name: Verify Firestore security rules in emulator
        run: npx firebase emulators:exec --project demo-vymx-trade-terminal --only firestore "node scripts/test-firestore-rules.mjs"

      # Preserve the full audit artifact, then block merges if any known advisory remains.
      - name: Generate full dependency vulnerability report
        if: always()
        run: npm audit --json --fetch-retries=3 --fetch-timeout=120000 > npm-audit.json || true

      - name: Generate production dependency vulnerability report
        if: always()
        run: npm audit --omit=dev --json --fetch-retries=3 --fetch-timeout=120000 > npm-audit-production.json || true

      - name: Summarize dependency audit
        if: always()
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          let report = {};
          try {
            report = JSON.parse(fs.readFileSync('npm-audit.json', 'utf8'));
          } catch {
            report = { error: 'npm audit did not return valid JSON (network, registry, or npm failure).' };
          }
          const counts = report.metadata?.vulnerabilities ?? {};
          const lines = [
            '## Full dependency audit (development + production)',
            '',
            '| Severity | Count |',
            '|---|---:|',
            ...['critical', 'high', 'moderate', 'low', 'info'].map(level => `| ${level} | ${counts[level] ?? 0} |`),
            '',
            report.error ?? 'Development-toolchain advisories are tracked separately. The production dependency audit below is the merge-blocking security gate.'
          ];
          fs.appendFileSync(process.env.GITHUB_STEP_SUMMARY, lines.join('\n') + '\n');
          NODE

      - name: Upload dependency audit reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: npm-audit-report
          path: |
            npm-audit.json
            npm-audit-production.json
          if-no-files-found: warn
          retention-days: 14

      - name: Require zero known production dependency vulnerabilities
        if: always()
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const report = JSON.parse(fs.readFileSync('npm-audit-production.json', 'utf8'));
          const counts = report.metadata?.vulnerabilities;
          if (!counts) throw new Error('Production dependency audit did not return vulnerability metadata.');
          console.log('Production dependency vulnerabilities:', JSON.stringify(counts, null, 2));
          if ((counts.total ?? Infinity) !== 0) {
            throw new Error('Production dependencies contain known vulnerabilities; remediate before merge.');
          }
          NODE

  dependency-candidate:
    name: Validate non-breaking dependency update candidate
    runs-on: ubuntu-latest
    permissions:
      contents: write
    timeout-minutes: 20
    steps:
      - name: Check out PR head
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha }}

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '22.19.0'
          cache: npm

      # Generate a candidate only. No --force and no package.json mutation.
      - name: Regenerate candidate lockfile from dependency classifications
        run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund

      - name: Install candidate lockfile
        run: npm ci

      - name: Typecheck candidate dependencies
        run: npm run lint

      - name: Test candidate dependencies
        run: npm test

      - name: Build candidate dependencies
        run: npm run build:artifacts

      - name: Audit candidate dependencies
        if: always()
        run: |
          npm audit --json > candidate-audit.json || true
          npm audit --omit=dev --json > candidate-audit-production.json || true

      - name: Summarize candidate audit
        if: always()
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          let report = {};
          try { report = JSON.parse(fs.readFileSync('candidate-audit.json', 'utf8')); }
          catch { report = { error: 'Candidate audit did not return valid JSON.' }; }
          const counts = report.metadata?.vulnerabilities ?? {};
          const lines = [
            '## Candidate dependency audit',
            '',
            '| Severity | Count |',
            '|---|---:|',
            ...['critical', 'high', 'moderate', 'low', 'info'].map(level => `| ${level} | ${counts[level] ?? 0} |`),
            '',
            report.error ?? 'Review all advisories. Development-toolchain advisories are tracked separately from production exposure.'
          ];
          fs.appendFileSync(process.env.GITHUB_STEP_SUMMARY, lines.join('\\n') + '\\n');
          NODE

      - name: Require zero known production dependency vulnerabilities
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const report = JSON.parse(fs.readFileSync('candidate-audit-production.json', 'utf8'));
          const counts = report.metadata?.vulnerabilities;
          if (!counts) throw new Error('Candidate production audit report is unavailable.');
          if ((counts.total ?? Infinity) !== 0) throw new Error('Candidate production dependencies still contain known vulnerabilities.');
          NODE

      - name: Commit validated dependency-group lockfile
        if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
        env:
          BRANCH_NAME: ${{ github.event.pull_request.head.ref }}
        run: |
          if git diff --quiet -- package-lock.json; then
            echo "Lockfile already matches package dependency groups."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json
          git commit -m "chore: align lockfile with dependency groups"
          git push origin "HEAD:${BRANCH_NAME}"

      - name: Upload dependency lockfile candidate and audit
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: dependency-lockfile-candidate
          path: |
            package-lock.json
            candidate-audit.json
            candidate-audit-production.json
          retention-days: 7
